[project]
name = "xhs-agent"
version = "0.1.0"
description = "小红书图文生成 Agent：检索 → 规划 → 写作 → 封面 → 审核 → 人工确认"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2",
  "pydantic>=2.6",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pillow>=10",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
pg = ["psycopg[binary]>=3.1", "psycopg-pool>=3.2", "langgraph-checkpoint-postgres>=2"]
dev = ["pytest>=8"]

[project.scripts]
xhs-agent = "xhs_agent.cli:main"
xhs-db = "xhs_agent.db:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xhs_agent = ["templates/*.html", "web/templates/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
